# Gitee Go pipeline for evo-agent
# 精简版：与本仓 .github/workflows/ci.yml 的 lint/test 对齐。
# 说明：核心仓 .gitee-ci 的 validate-pr 强阻塞门禁（validate-*.ps1 五件套 + check_doc_safety.py）
# 依赖核心仓 scripts/ 下的专属脚本，本仓无该套件，故不复制该阶段；文档门禁集中在核心仓运行。

stages:
  - lint
  - test

variables:
  GIT_DEPTH: "20"

lint:
  stage: lint
  image: rust:1.92-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config git
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - ".gitee-ci/**"

test:
  stage: test
  image: rust:1.92-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config git
    - cargo test --workspace --all-targets
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - ".gitee-ci/**"

# === Ecosystem license gate (parity with GitHub license-gate.yml @ pinned root commit) ===
license:
  stage: license
  image: rust:1.98.1-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    # cargo-deny pinned 0.20.2 (verified against root deny.toml); fallback to cargo install on download failure
    - curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C /usr/local/bin --strip-components=1 || cargo install cargo-deny --locked --version 0.20.2
    - cargo deny check
  rules:
    - changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"
        - ".gitee-ci/**"
