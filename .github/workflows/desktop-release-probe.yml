#
# Desktop 发布通道探针 — 发布后端到端自动校验（人工上传 Release 后手动触发，
# 或按需巡检）。校验对象 = 公开更新链的真实用户视角：
#   1. 滚动通道 latest.json 可拉取且结构完整（version/notes/platforms）
#   2. version 为合法 semver 形态
#   3. latest.json 内 url 的安装包资产真实可达（HEAD 200）
#   4. 安装包与 .sig 配对资产同 release 在场（签名缺失 = 更新链断）
# 任何断言失败 exit 1 —— 发布未收口（latest 滚动通道漏刷是历史惯犯，
# 见 desktop/RELEASE.md 收口清单）。
name: Desktop Release Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe public update channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe rolling-channel latest.json
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/evorule/evo-agent-desktop"
          curl -fsSL --max-time 30 "$BASE/releases/latest/download/latest.json" -o latest.json
          echo "--- latest.json ---"
          cat latest.json

          VERSION=$(python3 -c "import json;d=json.load(open('latest.json'));print(d['version'])")
          URL=$(python3 -c "import json;d=json.load(open('latest.json'));print(d['platforms']['windows-x86_64']['url'])")
          SIGLEN=$(python3 -c "import json;d=json.load(open('latest.json'));print(len(d['platforms']['windows-x86_64']['signature'].strip()))")

          echo "version=$VERSION url=$URL sig_chars=$SIGLEN"

          # 1. version 必须是 x.y.z 形态（防 latest.json 写坏/写旧）
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: version '$VERSION' is not semver-shaped"; exit 1; }

          # 2. notes 允许空，但 platforms 至少要有 windows-x86_64 且签名非空
          #    （签名缺失 = 更新器验签必败，发布不收口）
          [ "$SIGLEN" -gt 0 ] || { echo "FAIL: empty updater signature in latest.json"; exit 1; }

          # 3. 安装包资产真实可达（钉版 permalink，HEAD 2xx）
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$URL")
          echo "asset HEAD: $CODE"
          [[ "$CODE" == 2* || "$CODE" == 30* ]] \
            || { echo "FAIL: installer asset unreachable ($CODE): $URL"; exit 1; }

          # 4. .sig 配对资产同批在场（url 指向 setup.exe，sig 同名 + .sig）
          SIGCODE=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$URL.sig")
          echo "sig asset HEAD: $SIGCODE"
          [[ "$SIGCODE" == 2* || "$SIGCODE" == 30* ]] \
            || { echo "FAIL: signature asset missing: $URL.sig"; exit 1; }

          echo "PROBE OK: channel serves v$VERSION, asset + signature reachable."
