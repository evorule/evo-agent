# Temporary diagnostic workflow (freeze bisection). Dispatch-only: never runs
# on push/PR, never intended to merge to main -- delete the branch when the
# bisection concludes. Purpose: run a subset of the lib test binary on an
# ubuntu hosted runner to determine which subset freezes the runner VM.
# Healthy subset => green with logs; killer subset => the run is reaped with
# the test step in flight (~50 min wall), which is the attribution signal.
name: freeze-bisect
on:
  workflow_dispatch:
    inputs:
      libtest_args:
        description: 'args after "cargo test --lib --" (positional filter and/or repeated --skip)'
        required: true
        default: ''
      label:
        description: 'bucket label shown in the job name'
        required: false
        default: 'bucket'
      mode:
        description: 'direct | direct-pwsh | verify-machinery'
        required: false
        default: 'direct'
jobs:
  bisect:
    name: bisect ${{ inputs.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-probe-fresh0

      - name: free runner disk (ubuntu)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true

      - name: compile (lib + test binaries)
        run: |
          cargo build --quiet -j2
          cargo test --lib --no-run -j2

      - name: run lib subset with resource watchdog
        if: inputs.mode != 'direct-pwsh' && inputs.mode != 'verify-machinery'
        shell: bash
        run: |
          ( while true; do
              echo "=== WD $(date -u +%H:%M:%S) load=$(cat /proc/loadavg) ==="
              free -m | sed -n 2p
              df -h / | tail -1
              ps aux --sort=-%mem | head -6
              echo "=== procs total=$(ps -e --no-headers | wc -l)"
              sleep 15
          done ) & WD=$!
          timeout --kill-after=30 3300 cargo test --lib -j2 -- ${{ inputs.libtest_args }} 2>&1
          RC=$?
          kill $WD 2>/dev/null
          echo "SUBSET_EXIT=$RC"
          exit $RC

      # Discriminator A: plain cargo test under a pwsh step shell (no
      # verify.ps1, no bash -c bridge) -- isolates the step-shell variable.
      - name: run lib subset (pwsh step shell, plain cargo)
        if: inputs.mode == 'direct-pwsh'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h /
          timeout --kill-after=30 3300 cargo test --lib -- ${{ inputs.libtest_args }} 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "== after =="; free -m; df -h /

      # Discriminator B: the exact verify.ps1 machinery the CI verify job uses
      # (pwsh bridge + internal watchdog + internal timeout) -- if the freeze
      # follows this mode and not the others, the machinery is the trigger.
      - name: run via verify.ps1 machinery (mirrors ci.yml verify steps)
        if: inputs.mode == 'verify-machinery'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h /
          ./verify.ps1 -Phase test-run -CargoArgs --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "== after =="; free -m; df -h /
