# CI for evo-agent
#
# Coverage:
# - lint: cargo fmt --check + cargo clippy (all targets)
# - verify: verify.ps1 on Linux + Windows (build + test + secret scan
#   + dependency-contract assertion) and doc tests
# - web-test: workbench frontend unit tests (vitest)
# - doc-safety: 公开面文档安全门禁 (scripts/check_doc_safety.py)
#
# Notes:
# - verify.ps1 is the canonical acceptance entry point; it re-runs
#   build + test internally, so the verify job does not duplicate them.
# - clippy runs without -D warnings: existing advisory warnings are
#   visible in the log but do not block CI.
name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (all targets)
        run: cargo clippy --all-targets

  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu verify death saga (2026-10-15/22): green (2-3 min
          # warm-cache runs) through 2026-10-14. On 10-15 five runs hung
          # inside cargo test (silent for hours, killed by the 6-hour job
          # cap; teardown showed orphan test binary + npm exec + sh). Since
          # 2026-10-16 every run had died mid-step (~48-52 min in, "lost
          # communication"), including ON the ubuntu-24.04 pin WITH -j2 +
          # debug=0 + fresh cache.
          #
          # A temporary load downgrade (tests: false, 2026-10-22) unblocked
          # the merge chain while a side diagnostic ran the full surface:
          # phase-split steps, tee'd streaming log, 15s resource watchdog.
          # The diagnostic went GREEN twice in a row (full 2172-test run,
          # ubuntu) and the same day produced a windows-latest image drift
          # (Git usr/bin appearing on PATH) -- evidence pointing at a
          # GitHub host/image regression rather than our workload, likely
          # fixed upstream or intermittent.
          #
          # Restored (2026-10-22, approved): tests back on. The resource
          # watchdog stays as a PERMANENT fixture of the linux test-run
          # phase inside verify.ps1 -- passive snapshots at zero risk; if
          # the freeze ever recurs, its streamed resource curve and the
          # culprit's process tree are captured right up to the death.
          - os: ubuntu-24.04
            name: ubuntu-latest
            tests: true
          - os: windows-latest
            name: windows-latest
            tests: true
    runs-on: ${{ matrix.os }}
    env:
      # Resource guard: a full debug build of this repo produces ~9.4 GB
      # of target artifacts, which sits right at the ubuntu runner disk
      # ceiling -- two CI runs died mid-step (~50 min in, step never
      # concluded, no log uploaded). Stripping debug info shrinks target
      # output several-fold on both runners; windows stays well clear of
      # its larger disk either way, and both platforms keep the same
      # build shape.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache-bust (2026-10-21): pre-mitigation runs cached ~9.4 GB of
          # debug-full target artifacts; restoring them re-fills the disk
          # even though new builds are slim (debug=0). Bump the key so a
          # fresh slim cache is built from scratch.
          key: ${{ matrix.os }}-slim1

      # 宪法 schema 校验组件以 git 依赖(rev 钉版)由 cargo 自动拉取,
      # 且 0.2.0 起 schema 编译期内嵌——运行时零磁盘依赖,无需检出宪法仓。

      # Phase-split layout (2026-10-21): one verify.ps1 phase per step.
      # Completed step logs survive a runner death; the resource echoes
      # bracket each phase with disk/memory state. The linux-only -j2 cap
      # is re-applied per step (job-level env would also cap windows).
      - name: verify 1/5 build
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h / }
          ./verify.ps1 -Phase build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { Write-Host "== after =="; free -m; df -h / }

      - name: verify 2/5 test-compile
        if: matrix.tests
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h / }
          ./verify.ps1 -Phase test-compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { Write-Host "== after =="; free -m; df -h / }

      - name: verify 3/5 test-run
        if: matrix.tests
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h / }
          ./verify.ps1 -Phase test-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { Write-Host "== after =="; free -m; df -h / }

      - name: verify 4/5 secret scan
        shell: pwsh
        run: |
          ./verify.ps1 -Phase scan
          exit $LASTEXITCODE

      - name: verify 5/5 dep contract
        shell: pwsh
        run: |
          ./verify.ps1 -Phase contract
          exit $LASTEXITCODE

      - name: doc tests
        if: matrix.tests
        run: cargo test --doc

  # ==========================================================================
  # web-test：工作台前端单测门禁（vitest,与 Rust 面同门禁）。
  # ==========================================================================
  web-test:
    name: web unit tests (vitest)
    runs-on: ubuntu-latest
    env:
      # vitest heap guard: the runner Node default old-space ceiling is too
      # small for the current web test volume (JavaScript heap OOM); raise it
      # for this job only (runner has 16 GB RAM).
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (upgraded from 20, 2026-10-23): the jsdom chain now pulls
          # undici v8, whose decompress interceptor references
          # zlib.createZstdDecompress -- a zstd API that only exists on
          # Node >= 22.15. On Node 20 that module crashes at load time
          # (TypeError: Cannot read properties of undefined (reading 'bind')).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vitest run
        run: npm test

  # ==========================================================================
  # doc-safety：公开面文档安全门禁 (与主仓 CI 同型)。
  # R-门控1 (staged 检查) 在 CI 无暂存区语义自动为空集, 不影响其余规则。
  # ==========================================================================
  doc-safety:
    name: doc safety (R rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: L1 文档安全与引用完整性
        run: python3 scripts/check_doc_safety.py

  # ==========================================================================
  # public-face-scan：公开面矩阵扫描 (与主仓 CI 同型)。
  # 词表五类: AI 身份 / 厂商名 / 内部批次编号 / 私有路径仓名 / 治理语境。
  # 本 job 对 A1(AI 身份) 与 B(内部编号) 计入退出码即红; C/D 类复核项不阻断。
  # ==========================================================================
  public-face-scan:
    name: public face scan (A1/B blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公开面矩阵扫描 (AI 身份 + 内部编号阻断)
        run: python3 scripts/scan_public_face.py --fail-on A1 --fail-on B

  # ==========================================================================
  # evid-parity：EVID 证据投影跨语言对拍。
  # Python 验证器（scripts/evid_verify.py）与 Rust 投影器（src/agent/evid.rs）
  # 共享同一哈希契约，由黄金向量（evid_golden_vectors.json）双向锁定：
  #   1) 自检 bootstrap 4/4
  #   2) 黄金向量对拍（Python 重算 == 期望值；Rust 侧在 cargo test 逐值断言）
  #   3) 七连破坏注入验收（篡改分类逐项红绿判定）
  # ==========================================================================
  evid-parity:
    name: evid cross-lang parity (vectors + injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install verifier deps (blake3 + pynacl)
        run: pip install blake3 pynacl

      - name: EVID verifier self-test (bootstrap 4/4)
        run: python3 scripts/evid_verify.py --self-test

      - name: EVID golden vectors cross-language parity
        run: python3 scripts/evid_verify.py --vectors scripts/evid_golden_vectors.json

      - name: EVID seven-fold tamper injection acceptance
        run: python3 scripts/evid_injection_test.py
