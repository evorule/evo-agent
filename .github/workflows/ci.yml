# CI for evo-agent
#
# Coverage:
# - lint: cargo fmt --check + cargo clippy (all targets)
#   + cargo check on the opt-in `semantic` feature (keeps the feature-gated
#   fastembed face from rotting unseen; default graph stays zero-onnx --
#   the contract phase asserts that independently)
# - verify: verify.ps1 on Linux + Windows (build + test + secret scan
#   + dependency-contract assertion) and doc tests
# - web-test: workbench frontend unit tests (vitest)
# - doc-safety: 公开面文档安全门禁 (scripts/check_doc_safety.py)
#
# Notes:
# - verify.ps1 is the canonical acceptance entry point; it re-runs
#   build + test internally, so the verify job does not duplicate them.
# - clippy runs without -D warnings: existing advisory warnings are
#   visible in the log but do not block CI.
name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (all targets)
        run: cargo clippy --all-targets

      # Feature-gated compile face: fastembed sits behind the opt-in
      # `semantic` feature, so the default CI graph never compiles it.
      # Check it here (type-check only, no codegen) so interface drift
      # cannot rot the gated code unseen. Type-check keeps this cheap;
      # the default graph stays zero-onnx regardless (contract phase).
      - name: cargo check (semantic feature)
        run: cargo check --features semantic

  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu verify death saga (2026-10-15/22): green (2-3 min
          # warm-cache runs) through 2026-10-14. On 10-15 five runs hung
          # inside cargo test (silent for hours, killed by the 6-hour job
          # cap; teardown showed orphan test binary + npm exec + sh). Since
          # 2026-10-16 every run had died mid-step (~48-52 min in, "lost
          # communication"), including ON the ubuntu-24.04 pin WITH -j2 +
          # debug=0 + fresh cache.
          #
          # A temporary load downgrade (tests: false, 2026-10-22) unblocked
          # the merge chain while a side diagnostic ran the full surface:
          # phase-split steps, tee'd streaming log, 15s resource watchdog.
          # The diagnostic went GREEN twice in a row (full 2172-test run,
          # ubuntu) and the same day produced a windows-latest image drift
          # (Git usr/bin appearing on PATH) -- evidence pointing at a
          # GitHub host/image regression rather than our workload, likely
          # fixed upstream or intermittent.
          #
          # Restored (2026-10-22, approved): tests back on. The resource
          # watchdog stays as a PERMANENT fixture of the linux test-run
          # phase inside verify.ps1 -- passive snapshots at zero risk; if
          # the freeze ever recurs, its streamed resource curve and the
          # culprit's process tree are captured right up to the death.
          - os: ubuntu-22.04
            name: ubuntu-latest-lib-a
            tests: true
            slice: a
          - os: ubuntu-22.04
            name: ubuntu-latest-lib-b1
            tests: true
            slice: b1
          - os: ubuntu-22.04
            name: ubuntu-latest-lib-b2
            tests: true
            slice: b2
          - os: ubuntu-22.04
            name: ubuntu-latest-lib-b3
            tests: true
            slice: b3
          - os: ubuntu-22.04
            name: ubuntu-latest-lib-b4
            tests: true
            slice: b4
          - os: ubuntu-22.04
            name: ubuntu-latest-int-c1
            tests: true
            slice: c1
          - os: ubuntu-22.04
            name: ubuntu-latest-int-c2
            tests: true
            slice: c2
          - os: ubuntu-22.04
            name: ubuntu-latest-pty-c3
            tests: true
            slice: c3
          - os: windows-latest
            name: windows-latest
            tests: true
    runs-on: ${{ matrix.os }}
    # Hard cap (2026-11-02): a stuck test-run used to hang until the hosted
    # runner was reaped server-side (~45 min after the runner went silent,
    # whole log blob lost). With a job cap, an alive-but-stuck runner fails
    # AT the step with its streamed log preserved.
    timeout-minutes: 60
    env:
      # Resource guard: a full debug build of this repo produces ~9.4 GB
      # of target artifacts, which sits right at the ubuntu runner disk
      # ceiling -- two CI runs died mid-step (~50 min in, step never
      # concluded, no log uploaded). Stripping debug info shrinks target
      # output several-fold on both runners; windows stays well clear of
      # its larger disk either way, and both platforms keep the same
      # build shape.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # The ubuntu runner disk ceiling (14 GB free) killed two test-run
      # steps mid-flight at exactly ~50m (step never concluded, no logs),
      # recurring 2026-11-01 on unrelated branches. Drop preinstalled
      # bundles we never use to reclaim ~25 GB before any cargo work.
      - name: free runner disk (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache-bust (2026-10-21): pre-mitigation runs cached ~9.4 GB of
          # debug-full target artifacts; restoring them re-fills the disk
          # even though new builds are slim (debug=0). Bump the key so a
          # fresh slim cache is built from scratch.
          # Warm-pool reroute (2026-11-03): controlled experiments showed the
          # ubuntu verify pool lineage went stale on 10-28 (every frozen run
          # died before its post-job save) and stale restores make this job
          # slow enough to cross the ~50-minute hosted-runner wall where the
          # job is killed with its whole log blob lost. Linux now restores the
          # healthy lineage validated today via prefix matching; a nightly
          # keep-warm run (freeze-bisect schedule) keeps it from going stale
          # again. Windows lineage stayed healthy and keeps its old key.
          key: ${{ runner.os == 'Linux' && 'ubuntu-probe-fresh0' || format('{0}-slim1', matrix.os) }}

      # 宪法 schema 校验组件以 git 依赖(rev 钉版)由 cargo 自动拉取,
      # 且 0.2.0 起 schema 编译期内嵌——运行时零磁盘依赖,无需检出宪法仓。

      # Phase-split layout (2026-10-21): one verify.ps1 phase per step.
      # Completed step logs survive a runner death; the resource echoes
      # bracket each phase with disk/memory state. The linux-only -j2 cap
      # is re-applied per step (job-level env would also cap windows).
      - name: verify 1/5 build
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h / }
          ./verify.ps1 -Phase build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { Write-Host "== after =="; free -m; df -h / }

      - name: verify 2/5 test-compile
        if: matrix.tests
        shell: pwsh
        run: |
          if ($IsLinux) { $env:CARGO_BUILD_JOBS = '2'; Write-Host "== before =="; free -m; df -h / }
          ./verify.ps1 -Phase test-compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { Write-Host "== after =="; free -m; df -h / }

      # Binary-split test-run (2026-11-02): the 10-31/11-02 freeze wave died
      # with the runner itself (~45 min into the single test-run step, whole
      # log blob lost with the agent -- nothing attributable). Same commit
      # runs the FULL suite green on a local linux box (4-core-pinned, real
      # python/node, flat memory). Splitting linux test-run into one step
      # per test binary turns the next blank step into an attribution: the
      # step whose conclusion goes null IS the culprit binary. Windows keeps
      # the combined step (it passes in ~8 min).
      - name: verify 3/5 test-run (windows combined)
        if: matrix.tests && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./verify.ps1 -Phase test-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # lib guard bypass (2026-11-12): the runner environment's job guard
      # (provjobd, root, visible in the watchdog process table) SIGKILLs the
      # test tree when a test creates an orphaned or surviving child process
      # or opens a pseudo-terminal (forkpty) -- the trigger is BEHAVIORAL,
      # not time-based: serial bisects pinned kills to pty_full_chain_echo_
      # and_kill, and the matrix experiment confirmed it (a 44.6s slice with
      # 1658 tests survived; a 293-test slice died 2.8s in, exactly when the
      # alphabetical order reached the pty:: module). The guard is per-job
      # and not configurable, so ubuntu runs the test surface as eight
      # matrix slices -- this also localizes any future kill to one slice.
      # b4 skips exactly ONE test by name: pty_full_chain_echo_and_kill is
      # the only pty-family test that opens a real pty (the other six are
      # pure logic; skipping by module used to hide them too, incl. the
      # unix-only shell_discovery_unix_fallback). The real forkpty path is
      # covered by slice c3, which runs the same full chain INSIDE a docker
      # container: the guard's process-tree tracking does not reach into
      # containers (the docker-backend shell_exec tests spawn and reap
      # children on every ubuntu run without ever tripping it), so the
      # container gives the unix pty path real CI coverage. Windows keeps
      # the in-lib test (ConPTY path, always green).
      #   a:  lib runner::+agent::            (1658 tests, green)
      #   b1: lib api::                       (513)
      #   b2: lib builtin_tools::             (432, timeout-terminate family green)
      #   b3: lib mcp::+io_handlers::         (211, node-spawning tests green)
      #   b4: lib --skip five prefixes + the one pty e2e test (exact complement)
      #   c1: integration_test binary         (30 e2e tests)
      #   c2: four small binaries + doc tests (8 e2e tests)
      #   c3: pty smoke inside docker         (1 e2e test, real forkpty)
      # a + b1..b4 cover the whole lib minus that one test with no hole.
      # All cargo args are passed as pwsh array literals: bare tokens after
      # -CargoArgs get eaten by pwsh's end-of-parameters marker ("--test
      # takes one argument").
      - name: verify 3/5a test-run lib (slices a/b1-b4)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice != 'c1' && matrix.slice != 'c2' && matrix.slice != 'c3'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'; $env:RUST_TEST_THREADS = '2'
          $slice = '${{ matrix.slice }}'
          if ($slice -eq 'a') {
            ./verify.ps1 -Phase test-run -CargoArgs '--lib','--','runner::','agent::'
          } elseif ($slice -eq 'b1') {
            ./verify.ps1 -Phase test-run -CargoArgs '--lib','--','api::'
          } elseif ($slice -eq 'b2') {
            ./verify.ps1 -Phase test-run -CargoArgs '--lib','--','builtin_tools::'
          } elseif ($slice -eq 'b3') {
            ./verify.ps1 -Phase test-run -CargoArgs '--lib','--','mcp::','io_handlers::'
          } else {
            ./verify.ps1 -Phase test-run -CargoArgs '--lib','--','--skip','api::','--skip','builtin_tools::','--skip','mcp::','--skip','io_handlers::','--skip','runner::','--skip','agent::','--skip','pty_full_chain_echo_and_kill'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify 3/5b test-run integration_test (slice c1)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c1'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          ./verify.ps1 -Phase test-run -CargoArgs '--test','integration_test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify 3/5c test-run io_contract_e2e (slice c2)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c2'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          ./verify.ps1 -Phase test-run -CargoArgs '--test','io_contract_e2e'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify 3/5d test-run mcp_gate_atomicity (slice c2)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c2'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          ./verify.ps1 -Phase test-run -CargoArgs '--test','mcp_gate_atomicity'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify 3/5e test-run o511_stack_repro (slice c2)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c2'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          ./verify.ps1 -Phase test-run -CargoArgs '--test','o511_stack_repro'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify 3/5f test-run serve_mcp_smoke (slice c2)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c2'
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          ./verify.ps1 -Phase test-run -CargoArgs '--test','serve_mcp_smoke'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # slice c3: the real forkpty path, docker-isolated. The guard's
      # process-tree tracking does not reach into containers (docker-backend
      # tests spawn and reap children on every ubuntu run without tripping
      # it), so the full chain that trips it in-process runs inside a plain
      # ubuntu:22.04 container (same glibc family as the runner build, so
      # the host-compiled binary executes as-is; the compile itself is a
      # cache-hit no-op after phase 2/5).
      - name: verify 3/5g test-run pty smoke (slice c3, docker)
        if: matrix.tests && runner.os == 'Linux' && matrix.slice == 'c3'
        shell: bash
        run: |
          CARGO_BUILD_JOBS=2 cargo test --test pty_smoke --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -name 'pty_smoke-*' -type f -perm -u+x ! -name '*.d' | head -1)
          echo "pty smoke binary: $BIN"
          docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 "$BIN" --test-threads 1 --nocapture

      - name: verify 4/5 secret scan
        shell: pwsh
        run: |
          ./verify.ps1 -Phase scan
          exit $LASTEXITCODE

      - name: verify 5/5 dep contract
        shell: pwsh
        run: |
          ./verify.ps1 -Phase contract
          exit $LASTEXITCODE

      - name: doc tests
        if: matrix.tests && (runner.os == 'Windows' || matrix.slice == 'c2')
        run: cargo test --doc

  # ==========================================================================
  # verify-compile: Linux compile sentinel (build + test-compile only, ~12 min).
  # Compile phases only, no test execution -- the hosted-runner freeze strikes
  # only the long test-run phase (never a compile phase in every recorded
  # event), so this job sits structurally outside the death zone and stays a
  # permanent, reliable Linux compile gate: any windows-green/linux-red
  # cross-platform break (e.g. a missing cfg gate) fails here on the PR,
  # independent of the unreliable full ubuntu verify.
  # ==========================================================================
  verify-compile:
    name: verify-compile (ubuntu-latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-compile-sentinel-slim1

      - name: free runner disk (ubuntu)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true

      - name: compile gate (build + all test binaries)
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = '2'
          Write-Host "== before =="; free -m; df -h /
          ./verify.ps1 -Phase build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify.ps1 -Phase test-compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "== after =="; free -m; df -h /

  # ==========================================================================
  # web-test：工作台前端单测门禁（vitest,与 Rust 面同门禁）。
  # ==========================================================================
  web-test:
    name: web unit tests (vitest)
    runs-on: ubuntu-latest
    env:
      # vitest heap guard: the runner Node default old-space ceiling is too
      # small for the current web test volume (JavaScript heap OOM); raise it
      # for this job only (runner has 16 GB RAM).
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (upgraded from 20, 2026-10-23): the jsdom chain now pulls
          # undici v8, whose decompress interceptor references
          # zlib.createZstdDecompress -- a zstd API that only exists on
          # Node >= 22.15. On Node 20 that module crashes at load time
          # (TypeError: Cannot read properties of undefined (reading 'bind')).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vitest run
        run: npm test

  # ==========================================================================
  # doc-safety：公开面文档安全门禁 (与主仓 CI 同型)。
  # R-门控1 (staged 检查) 在 CI 无暂存区语义自动为空集, 不影响其余规则。
  # ==========================================================================
  doc-safety:
    name: doc safety (R rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: L1 文档安全与引用完整性
        run: python3 scripts/check_doc_safety.py

  # ==========================================================================
  # evid-parity：EVID 证据投影跨语言对拍。
  # Python 验证器（scripts/evid_verify.py）与 Rust 投影器（src/agent/evid.rs）
  # 共享同一哈希契约，由黄金向量（evid_golden_vectors.json）双向锁定：
  #   1) 自检 bootstrap 4/4
  #   2) 黄金向量对拍（Python 重算 == 期望值；Rust 侧在 cargo test 逐值断言）
  #   3) 七连破坏注入验收（篡改分类逐项红绿判定）
  # ==========================================================================
  evid-parity:
    name: evid cross-lang parity (vectors + injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install verifier deps (blake3 + pynacl)
        run: pip install blake3 pynacl

      - name: EVID verifier self-test (bootstrap 4/4)
        run: python3 scripts/evid_verify.py --self-test

      - name: EVID golden vectors cross-language parity
        run: python3 scripts/evid_verify.py --vectors scripts/evid_golden_vectors.json

      - name: EVID seven-fold tamper injection acceptance
        run: python3 scripts/evid_injection_test.py

  # Ecosystem license gate (reusable workflow, pinned to root-repo commit)
  license-gate:
    name: license gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/license-gate.yml@9d0e4fdbb28cfd0db1051c9014149f198b290e6b

