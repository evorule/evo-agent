[project]
name = "evo-agent-ale"
version = "0.1.0"
description = "Agents' Last Exam (ALE) deployer for the evo-agent harness"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."ale.agents"]
evo-agent = "evo_agent_ale.deployer:EvoAgentDeployer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evo_agent_ale*"]
