# 发版捆绑模板（唯一源）——desktop/templates/evo-agent.toml
#
# build-installer.ps1 以本文件为捆绑 resources/evo-agent/evo-agent.toml 的基座；
# 仓根 evo-agent.toml 是开发本地配置（gitignore），不再是发版源。
# service_tools 段由 desktop/scripts/sync-service-tools.ps1 从执行侧 SSOT
# （server 仓 plugins/*/official_native_services.json 并集）再生成，
# build-installer 内嵌 -Check 校验，漂移即构建红。
# 动态值（端口/引擎地址/令牌/key）一律由壳在运行期 env 注入，不入本模板。

[llm]
provider = "minimax"
model = "MiniMax-M3"
# 单回输出上限:推理模型(M3)的推理计入输出配额,4096 硬帽会被纯推理吃满
# 导致回合被截断误判完成——长回合 agentic 场景须放开(2026-10-25)
max_tokens = 32768
# 预算基数口径：记忆区预算默认以输入侧为基数（input = 总窗扣除 25% 响应预留 = 750000；
# 默认配方记忆区预算 = 750000 × 0.25 = 187500 token）。如需沿用旧总窗口径（记忆区 51200），
# 在 definition 装配配方记忆槽显式声明 base = "total_window"（向后兼容保留）
# MiniMax-M3 满窗 1M（保障 512K）：按用户裁定取满窗——M3 费用无负担，跑时
# 不多开窗口/并发会话，防本机内存吃紧被撑爆
context_window_tokens = 1000000  # M3 满窗 1M（用户裁定 2026-10-16）；换模型须同步修改
api_base = "https://api.minimaxi.com/v1/text/chatcompletion_v2"

