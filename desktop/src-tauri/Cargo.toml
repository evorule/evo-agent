[package]
name = "evo-agent-desktop"
version = "0.7.11"
edition = "2021"
description = "evo-agent desktop shell"
license = "AGPL-3.0-or-later"

[lib]
name = "evo_agent_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# 技能期刊签名引导密钥源（壳每次启动生成一次性种子经 env 交接 serve）
getrandom = "0.2"

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# update.rs 检查侧调用点超时包裹用（builder timeout 已放开到下载级，
# check 的 30s 由 tokio::time::timeout 在调用点恢复——拆分依据见该文件）
tokio = { version = "1", features = ["time"] }
toml = "0.8"
rand = "0.8"
base64 = "0.22"
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
] }
