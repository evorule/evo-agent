# evo-agent 项目级配置
#
# 配置加载优先级(低→高):
#   1. 代码默认值
#   2. 用户配置 (~/.config/evo-agent/config.toml 或 %APPDATA%\evo-agent\config.toml)
#   3. 项目配置 (本文件)
#   4. 环境变量 (EVO_AGENT_* 前缀, __ 分隔 section/field)
#
# API key 通过环境变量注入(不在配置文件中硬编码):
#   $env:MINIMAX_API_KEY = "你的真实 API key"
#   或
#   $env:EVO_AGENT_LLM__API_KEY = "你的真实 API key"

[llm]
# provider: minimax | deepseek | openai
provider = "minimax"
# api_key 支持 ${ENV:VAR_NAME} 占位符,加载时展开为环境变量值
api_key = "${ENV:MINIMAX_API_KEY}"
model = "MiniMax-M2.5"
api_base = "https://api.minimaxi.com/v1/text/chatcompletion_v2"
timeout_secs = 60
max_retries = 3

[evorule]
# evorule HTTP 服务地址(端到端测试用 18082)
base_url = "http://127.0.0.1:18082"
# evorule API key(留空 = evorule 本身无鉴权)
api_key = ""
timeout_secs = 30

[logging]
# trace | debug | info | warn | error
level = "info"
# json | pretty
format = "pretty"

[agents]
# AgentDefinition 文件目录
# 启动时扫描 <dir>/*.json
dir = "./agents"
# 不指定 --agent 时使用的 agent
default = "general"
