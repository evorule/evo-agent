[package]
name = "evo-agent"
version = "0.1.0"
edition = "2021"
description = "Evo-Agent - AI Agent orchestration layer using evorule HTTP API"
license = "AGPL-3.0"

[dependencies]
tier0-tcb = { path = "../evorule/tier0-tcb" }
tier1-reactor = { path = "../evorule/tier1-reactor" }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

prometheus = "0.13"

reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"

blake3 = "1"

axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"

async-trait = "0.1"

clap = { version = "4", features = ["derive", "env"] }

# Config loading
toml = "0.8"

[dependencies.serde_with]
version = "3"
features = ["json"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio-test = "0.4"
