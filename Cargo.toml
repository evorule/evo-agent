[package]
name = "evo-agent"
version = "0.2.0"
edition = "2021"
description = "Evo-Agent - AI Agent orchestration layer using evorule HTTP API"
license = "AGPL-3.0-or-later"
[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
    # G12:MCP stdio 传输 —— spawn 子进程 + 读写 stdin/stdout
    "process",
    "io-util",
] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"

# G6: CancellationToken — 外部可触发的取消信号(run/select!/Ctrl+C/HTTP cancel)
tokio-util = { version = "0.7", features = ["rt"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

prometheus = "0.13"

reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"

# http_get host 归一化分类:与 reqwest 同源的 url 解析(WHATWG IPv4/IPv6
# host 语义),十进制整数/点分简写/十六进制等形态先归一化为标准 IP 再判
# SSRF,防「形态特殊」绕过分类
url = "2"

# G3: LLM 重试退避抖动所需
rand = "0.8"

# G7: 恒定时间比较(防时序攻击)
subtle = "2"

# G11: JSON Schema 校验(结构化输出)
jsonschema = "0.21"

# plan-execute 外层驱动：PlanFact 计划形态 hash（parent_plan_hash，64-hex；BLAKE3 与生态哈希纪律一致）
blake3 = "1"

# diff_runs：两段文本的行级结构化比对（纯函数，查账工具族）
similar = "2"

# 宪法 schema 校验共享组件(属地执法统一实现;0.2.0 起 schema 编译期内嵌,
# 运行时零磁盘依赖)。git 依赖 + rev 钉版:crate 未发 crates.io 前的受控消费,
# 宪法演进须先推 system-rules 再随动升级 rev(演进 SOP)
evorule-constitution = { git = "https://gitee.com/evorule/evorule-system-rules", rev = "92a009acd3ddd949875d02d35d7ccf8fd8376ce4" }

# 快照包类型+自洽校验(DatasetBundle/BundleImporter,TCB 纯函数库)——
# skill pack → 执行域 bundle 桥接用;版本与 evorule-server 消费面同源对齐,
# 升级时两仓同批(哈希字节兼容依赖同版本序列化形态)
evorule-bundle = "0.3.1"

# 规范哈希单一真相源(B 族纪律:禁自写 blake3,skill 注册账本钉哈希用;
# 版本与 evorule-bundle 传递依赖同源,0.1.4 AGPL-3.0-or-later)
evorule-hash = "0.1.4"

# G16:WebSocket 双向流 —— 需要 axum 的 ws feature
axum = { version = "0.8", features = ["ws"] }
http = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"

async-trait = "0.1"

clap = { version = "4", features = ["derive", "env"] }

# Config loading
toml = "0.8"

# G15: REPL 行编辑(跨平台,支持 Windows)
rustyline = "14"

# L2 SafetyAuditor(P1-F6/P2-V2 修复):Prompt 注入规则匹配
regex = "1"

# 阶段 1(F-618)LexStore 检索缓存:本地 SQLite(进程内,非内核依赖;
# bundled=自编 SQLite 免系统库版本纠缠;WAL 模式)
rusqlite = { version = "0.32", features = ["bundled"] }

# 全项目内容搜索:rg 官方 crate 家族(并行遍历+gitignore/正则匹配/逐行搜索器/glob)
ignore = "0.4"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
notify = "8"
notify-debouncer-full = "0.5"

# B3 Git 基础面:libgit2 官方绑定(statuses 双态/rename/blob 读取/stage/reset_default/
# checkout_index/commit);hooks 保真走 git CLI 子进程回退(见 src/git/mod.rs)
git2 = "0.20"

[dependencies.serde_with]
version = "3"
features = ["json"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio-test = "0.4"
# G16:WebSocket 单元测试客户端
tokio-tungstenite = "0.24"
