[package]
name = "evo-agent"
version = "0.1.0"
edition = "2021"
description = "Evo-Agent - AI Agent orchestration layer using evorule HTTP API"
license = "AGPL-3.0-or-later"
[dependencies]
evorule-tcb = "0.3.2"
evorule-reactor = "0.3.2"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
    # G12:MCP stdio 传输 —— spawn 子进程 + 读写 stdin/stdout
    "process",
    "io-util",
] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"

# G6: CancellationToken — 外部可触发的取消信号(run/select!/Ctrl+C/HTTP cancel)
tokio-util = { version = "0.7", features = ["rt"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

prometheus = "0.13"

reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"

# G3: LLM 重试退避抖动所需
rand = "0.8"

# G7: 恒定时间比较(防时序攻击)
subtle = "2"

# G11: JSON Schema 校验(结构化输出)
jsonschema = "0.18"

# G16:WebSocket 双向流 —— 需要 axum 的 ws feature
axum = { version = "0.8", features = ["ws"] }
http = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"

async-trait = "0.1"

clap = { version = "4", features = ["derive", "env"] }

# Config loading
toml = "0.8"

# G15: REPL 行编辑(跨平台,支持 Windows)
rustyline = "14"

# L2 SafetyAuditor(P1-F6/P2-V2 修复):Prompt 注入规则匹配
regex = "1"

[dependencies.serde_with]
version = "3"
features = ["json"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio-test = "0.4"
# G16:WebSocket 单元测试客户端
tokio-tungstenite = "0.24"
